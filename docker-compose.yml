version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: deepfake-backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/deepfake_enhanced_model.keras
    volumes:
      - ./backend/models:/app/models
    command: python main.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: deepfake-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev

networks:
  default:
    name: deepfake-network
